version: '3.8'

services:
  # 文档处理服务
  doc-process-service:
    build: .
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://admin:password@postgres:5432/docu_sage
      - REDIS_URL=redis://redis:6379/0
      - MILVUS_URI=http://milvus:19530
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - CELERY_BROKER_URL=redis://redis:6379/1
    volumes:
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
      - milvus
      - minio
      - kafka
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 60s

  # PostgreSQL数据库
  postgres:
    image: postgres:15
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=docu_sage
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d docu_sage"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis缓存
  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command:
      - "redis-server"
      - "--maxmemory"
      - "1gb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Milvus向量数据库
  milvus:
    image: milvusdb/milvus:v2.3.4
    restart: always
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus/data
      - milvus_logs:/var/lib/milvus/logs
      - milvus_wal:/var/lib/milvus/wal
      - milvus_cache:/var/lib/milvus/cache
    environment:
      - MILVUS_ETCD_ENDPOINTS=etcd:2379
      - MILVUS_MINIO_ADDRESS=minio:9000
      - MILVUS_MINIO_ROOT_USER=minioadmin
      - MILVUS_MINIO_ROOT_PASSWORD=minioadmin
      - MILVUS_MINIO_USE_SSL=false
    depends_on:
      - etcd
      - minio

  # etcd（Milvus依赖）
  etcd:
    image: quay.io/coreos/etcd:v3.5.0
    restart: always
    ports:
      - "2379:2379"
    volumes:
      - etcd_data:/etcd-data
    command:
      - "etcd"
      - "--data-dir=/etcd-data"
      - "--listen-client-urls=http://0.0.0.0:2379"
      - "--advertise-client-urls=http://etcd:2379"
      - "--listen-peer-urls=http://0.0.0.0:2380"
      - "--initial-advertise-peer-urls=http://etcd:2380"
      - "--initial-cluster=etcd=http://etcd:2380"
      - "--initial-cluster-token=etcd-token"
      - "--initial-cluster-state=new"

  # MinIO对象存储
  minio:
    image: minio/minio:latest
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command:
      - "server"
      - "/data"
      - "--console-address=:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Kafka消息队列
  kafka:
    image: bitnami/kafka:3.4
    restart: always
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_data:/bitnami/kafka/data

  # Adminer（数据库管理工具）
  adminer:
    image: adminer:latest
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
  milvus_data:
  milvus_logs:
  milvus_wal:
  milvus_cache:
  etcd_data:
  minio_data:
  kafka_data: